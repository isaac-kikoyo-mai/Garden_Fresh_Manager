{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between">

    <h3>Sales History</h3>

    <a href="{% url 'create_sale' %}"
       class="btn btn-success">
        New Sale
    </a>

</div>

<hr>

<table class="table table-bordered">

    <thead>

        <tr>
            <th>Date</th>
            <th>Product</th>
            <th>Amount</th>
            <th>Customer</th>
        </tr>

    </thead>

    <tbody>

        {% for sale in sales %}

        <tr>
            <td>{{ sale.sale_date }}</td>
            <td>{{ sale.product }}</td>
            <td>UGX {{ sale.amount }}</td>
            <td>{{ sale.customer_name }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="6">
                No sales recorded.
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
