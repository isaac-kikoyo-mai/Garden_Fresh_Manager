<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Garden Fresh Manager</title>

</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h3 class="text-center mb-4">

                            Garden Fresh Manager

                        </h3>

                        <form method="POST">

                            {% csrf_token %}

                            <input type="text"
                                   name="username"
                                   placeholder="Username"
                                   class="form-control mb-3">

                            <input type="password"
                                   name="password"
                                   placeholder="Password"
                                   class="form-control mb-3">

                            <button type="submit"
                                    class="btn btn-success w-100">

                                Login

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
